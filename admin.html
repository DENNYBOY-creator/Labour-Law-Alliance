<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CRM | Labour Law Alliance</title>
<link rel="icon" href="/assets/images/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Josefin+Sans:wght@600;700&display=swap">
<style>
:root{
  --bg:#f3f4f7;--panel:#fff;--ink:#16203b;--muted:#5f6b7c;--line:#e2e5ec;--soft:#eef1f6;
  --navy:#16203b;--rail:#16203b;--rail-ink:#c9cfdb;--gold:#a07a12;--gold-bg:#fbf3dc;--blue:#1f74c9;--blue-bg:#e5f0fc;
  --red:#c0392b;--red-bg:#fdeceb;--amber:#b46a00;--amber-bg:#fff3dc;--green:#1e7a46;--green-bg:#e4f4ea;--violet:#5b3fc4;--violet-bg:#eeeafd;
  --display:'Josefin Sans','Trebuchet MS',sans-serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1524;--panel:#172033;--ink:#e7ebf3;--muted:#9aa5b8;--line:#273249;--soft:#1d2740;
  --rail:#0b1020;--rail-ink:#aeb8cc;--gold:#e2bd52;--gold-bg:#3a3018;--blue:#6fb1f5;--blue-bg:#16304d;
  --red:#f08a7e;--red-bg:#43201d;--amber:#f0b55a;--amber-bg:#3d2d14;--green:#6fd49a;--green-bg:#173726;--violet:#b3a3f5;--violet-bg:#2a2350;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hidden{display:none!important}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-card{background:var(--panel);width:100%;max-width:380px;border-radius:12px;box-shadow:0 10px 30px rgba(22,32,59,.12);overflow:hidden;border:1px solid var(--line)}
.login-card .bar{height:6px;background:linear-gradient(90deg,#16203b,#349cfc 35%,#d3a728 70%,#fd5d14)}
.login-card form{padding:28px;display:flex;flex-direction:column;gap:6px}
.login-card img{width:170px;display:block;margin:0 auto 12px;background:#fff;border-radius:6px;padding:4px}
.login-card h1{font-family:var(--display);font-size:20px;text-align:center;margin:0 0 12px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding:18px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 10px;color:#fff;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.4px;line-height:1.2}
.brand small{font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#d3a728}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:#7d89a3;padding:12px 10px 4px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:6px;color:var(--rail-ink);text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:rgba(211,167,40,.16);color:#fff;box-shadow:inset 3px 0 0 #d3a728}
.nav a.soon{opacity:.5;pointer-events:none}
.nav .n{font-size:11px;background:rgba(255,255,255,.12);border-radius:10px;padding:0 7px;font-variant-numeric:tabular-nums}
.nav .n.hot{background:#c0392b;color:#fff}
.nav .soon-tag{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:#7d89a3}
.me{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:10px;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px;word-break:break-all}
.me button{background:none;border:1px solid rgba(255,255,255,.18);color:var(--rail-ink);border-radius:6px;padding:5px 8px;cursor:pointer;text-align:left}
.me button:hover{color:#fff;border-color:rgba(255,255,255,.4)}
main{min-width:0;padding:22px 20px 48px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.top .acts{display:flex;gap:8px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.15;margin:0}
h2{font-family:var(--display);font-weight:600;font-size:17px;margin:0}
.sub{color:var(--muted);margin:4px 0 0;max-width:72ch}
.eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel>.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:2fr 1fr}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{color:var(--muted);font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 12px;font-weight:500;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.55;cursor:default}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--red)}
.btn.sm{padding:3px 9px;font-size:12.5px}
@media (prefers-color-scheme:dark){.btn.pri{background:#d3a728;border-color:#d3a728;color:#16203b}}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.mono{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;white-space:nowrap}
.meta{color:var(--muted);font-size:12.5px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.p-red{background:var(--red-bg);color:var(--red)}.p-amber{background:var(--amber-bg);color:var(--amber)}.p-green{background:var(--green-bg);color:var(--green)}.p-blue{background:var(--blue-bg);color:var(--blue)}.p-gold{background:var(--gold-bg);color:var(--gold)}.p-violet{background:var(--violet-bg);color:var(--violet)}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.date{flex:0 0 52px;text-align:center;border:1px solid var(--line);border-radius:7px;padding:3px 0;line-height:1.15}
.date b{display:block;font-family:var(--display);font-size:19px}
.date span{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--soft);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--muted)}
.card b{font-size:13px;line-height:1.3}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:#d3a728}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:5px 12px;cursor:pointer;font-weight:500;color:var(--muted)}
.subtabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
dl.kv{display:grid;grid-template-columns:minmax(110px,170px) 1fr;gap:7px 14px;margin:0}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;min-width:0;white-space:pre-wrap;word-break:break-word}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{font-size:12px;padding:4px 9px;border-radius:6px;background:var(--soft);color:var(--muted);border:0;cursor:pointer}
.steps button.done{background:var(--green-bg);color:var(--green)}
.steps button.now{background:var(--navy);color:#fff}
.bar{height:8px;border-radius:5px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:#d3a728}
.callout{border-radius:8px;padding:10px 12px;font-size:13px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:8px;background:var(--soft);font-size:13px}
.led{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
.led.off{background:var(--muted);box-shadow:0 0 0 3px var(--soft)}
.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label,.lbl{font-size:12.5px;font-weight:600}
.hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=date],input[type=datetime-local],input[type=number],input[type=search],select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px 10px;width:100%}
textarea{min-height:90px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;flex-direction:row}
.msg{font-size:13px;color:var(--red);min-height:1em}
.msg.ok{color:var(--green)}
.inbox{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);padding:0;overflow:hidden}
.ilist{border-right:1px solid var(--line);max-height:72vh;overflow:auto}
.imsg{display:flex;gap:10px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left}
.imsg:hover,.imsg.on{background:var(--soft)}
.imsg .dot{flex:0 0 8px;height:8px;border-radius:50%;margin-top:7px}
.imsg.unread .dot{background:#d3a728}
.imsg.unread b{font-weight:700}
.iread{padding:18px;min-width:0;max-height:72vh;overflow:auto}
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto}
.day{background:var(--soft);border-radius:9px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:180px}
.day.today{box-shadow:inset 0 0 0 2px #d3a728}
.day h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:0}
.appt{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px;display:flex;flex-direction:column;gap:2px;border-top:3px solid var(--blue);cursor:pointer;text-align:left;width:100%}
.appt.k-ccma,.appt.k-court{border-top-color:var(--red)}.appt.k-hearing{border-top-color:var(--amber)}.appt.k-consultation{border-top-color:#d3a728}
.appt.cancelled{opacity:.5;text-decoration:line-through}
.modal-bg{position:fixed;inset:0;background:rgba(11,16,32,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
.modal{background:var(--panel);border-radius:12px;width:100%;max-width:720px;box-shadow:0 20px 50px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal .mb{padding:16px 18px}
.modal .mf{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal .mf .msg{margin-right:auto}
.x{background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:var(--muted)}
.toast{position:fixed;right:16px;bottom:16px;background:#16203b;color:#fff;padding:10px 14px;border-radius:8px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:30}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g21{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:0;height:auto;z-index:10;flex-direction:row;align-items:center;gap:10px;padding:10px 12px;overflow-x:auto}
  .brand small,.nav .grp,.me,.nav .soon{display:none}
  .brand{flex:0 0 auto;font-size:14px;padding:0}
  .nav{flex-direction:row}.nav a{white-space:nowrap;padding:6px 10px}
  main{padding:16px 16px 40px}
  .g2,.g4,.f{grid-template-columns:1fr}
  .inbox{grid-template-columns:1fr}.ilist{border-right:0;max-height:none}.iread{max-height:none;border-top:1px solid var(--line)}
  dl.kv{grid-template-columns:1fr;gap:2px 0}dl.kv dd{margin-bottom:8px}
  h1{font-size:22px}
}
</style>
</head>
<body>

<section id="login" class="login hidden">
  <div class="login-card">
    <div class="bar"></div>
    <form id="login-form">
      <img src="/assets/images/logo.png?v=2" alt="Labour Law Alliance">
      <h1>Staff sign in</h1>
      <label class="lbl" for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label class="lbl" for="password" style="margin-top:8px">Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <button class="btn pri" type="submit" style="margin-top:14px">Sign in</button>
      <button class="btn" type="button" id="magic">Email me a sign-in link</button>
      <p class="hint" style="text-align:center">First time, or forgot your password? Enter your email and use the sign-in link.</p>
      <p class="msg" id="login-msg" role="alert"></p>
    </form>
  </div>
</section>

<div id="app" class="app hidden">
  <aside class="rail">
    <div class="brand">Labour Law Alliance<small>Practice CRM</small></div>
    <nav class="nav" id="nav" aria-label="CRM modules"></nav>
    <div class="me"><span id="who"></span><button type="button" id="setpw">Set password</button><button type="button" id="logout">Sign out</button></div>
  </aside>
  <main><div class="wrap" id="view"><p class="meta">Loading…</p></div></main>
</div>

<div id="modal-root"></div>
<div class="toast hidden" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/assets/js/crm.js?v=5"></script>
</body>
</html>
